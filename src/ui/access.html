<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Access kucedr-cloud</title>
		<link rel="stylesheet" href="/ui/styles.css" />
		<script type="module" src="/ui/access.js"></script>
	</head>
	<body class="access-body">
		<main class="access-shell">
			<section class="access-card" aria-labelledby="access-title">
				<p class="eyebrow">kucedr-cloud</p>
				<h1 id="access-title">Access your workspace</h1>
				<p id="access-subtitle" class="access-subtitle">
					Generate your first access key, copy it, then paste it below.
				</p>

				<div id="generated-access" class="generated-access" hidden>
					<span>Generated access key</span>
					<output id="generated-key" tabindex="0"></output>
					<button id="access-copy" class="button button-secondary" type="button">Copy key</button>
				</div>

				<form id="access-form">
					<div class="field">
						<label for="access-input">Access key</label>
						<input
							id="access-input"
							type="password"
							autocomplete="current-password"
							spellcheck="false"
							placeholder="kucedr-cloud_…"
							required
						/>
					</div>
					<div class="access-actions">
						<button id="generate-access" class="button button-secondary" type="button">
							Generate access key
						</button>
						<button id="access-save" class="button button-primary" type="submit">
							Save and continue
						</button>
					</div>
				</form>

				<p id="access-notice" class="notice access-notice" data-kind="info" aria-live="polite">
					The key is shown only during setup. Store your copy somewhere safe.
				</p>
			</section>
		</main>
	</body>
</html>
