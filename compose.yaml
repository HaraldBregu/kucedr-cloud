name: kucedr-cloud

services:
  app:
    build:
      context: .
    init: true
    ports:
      - '${KUCEDR_CLOUD_BIND_ADDRESS:-127.0.0.1}:${KUCEDR_CLOUD_PORT:-3000}:3000'
    environment:
      KUCEDR_CLOUD_PUBLIC_URL: ${KUCEDR_CLOUD_PUBLIC_URL:?set KUCEDR_CLOUD_PUBLIC_URL in .env}
      KUCEDR_CLOUD_ADMIN_TOKEN: ${KUCEDR_CLOUD_ADMIN_TOKEN:?set KUCEDR_CLOUD_ADMIN_TOKEN in .env}
      KUCEDR_CLOUD_CONFIG_KEY: ${KUCEDR_CLOUD_CONFIG_KEY:?set KUCEDR_CLOUD_CONFIG_KEY in .env}
      KUCEDR_CLOUD_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - kucedr-cloud-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  kucedr-cloud-data:
